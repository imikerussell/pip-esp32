<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pip voice audition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#fff6ee; --bg2:#ffe9d9; --card:#ffffff; --ink:#3d2a22; --muted:#a08578; --line:#f3dccb;
    --peach:#ffc8a8; --peach2:#ffb48a; --coral:#F56138; --coral2:#ff7d57; --blush:#ff9eaa;
    --mint:#3fb98a; --mintbg:#e3f7ee; --id:#b0603e;
    --shadow:0 2px 0 rgba(180,110,70,.08), 0 10px 28px -12px rgba(180,110,70,.35);
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; color:var(--ink); font:15px/1.4 Nunito, -apple-system, sans-serif;
    background: radial-gradient(1200px 500px at 15% -10%, #ffe2cc 0%, transparent 60%),
                radial-gradient(900px 400px at 100% 0%, #ffe0e6 0%, transparent 55%), var(--bg);
    min-height:100vh; }
  h1, .title, .section, button { font-family:Fredoka, Nunito, sans-serif; }

  /* header */
  header { display:flex; align-items:center; gap:16px; padding:18px 28px; flex-wrap:wrap;
    position:sticky; top:0; z-index:5; backdrop-filter:blur(14px); background:rgba(255,246,238,.82); border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:center; gap:12px; }
  .brand svg { width:52px; height:52px; animation:bob 3.2s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-3px) } }
  .brand h1 { margin:0; font-size:24px; font-weight:700; letter-spacing:-.2px; }
  .brand small { display:block; font:600 12px Nunito; color:var(--muted); letter-spacing:.3px; }
  .search { flex:1; min-width:200px; max-width:380px; position:relative; }
  .search input { width:100%; background:#fff; color:var(--ink); border:2px solid var(--line); border-radius:999px; padding:11px 16px 11px 42px; font:600 15px Nunito; outline:none; transition:border-color .15s, box-shadow .15s; }
  .search input:focus { border-color:var(--peach2); box-shadow:0 0 0 4px rgba(255,180,138,.25); }
  .search::before { content:"🔍"; position:absolute; left:16px; top:50%; transform:translateY(-50%); font-size:14px; opacity:.6; }
  .chosen { margin-left:auto; display:flex; align-items:center; gap:10px; background:#fff; border:2px solid var(--line); border-radius:16px; padding:8px 14px; box-shadow:var(--shadow); }
  .chosen.set { border-color:var(--mint); background:var(--mintbg); }
  .chosen .lbl { font:700 11px Nunito; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; }
  .chosen .name { font:600 16px Fredoka; }
  .chosen code { display:block; font:12px ui-monospace, Menlo, monospace; color:var(--id); user-select:all; }

  /* line picker */
  .lines-wrap { padding:18px 28px 6px; }
  .lines-wrap .section { margin-bottom:10px; }
  .lines { display:flex; gap:10px; flex-wrap:wrap; }
  .line { background:#fff; border:2px solid var(--line); color:var(--ink); border-radius:999px; padding:9px 16px; font-size:14px; font-weight:500; cursor:pointer; transition:all .15s; }
  .line:hover { border-color:var(--peach2); transform:translateY(-1px); }
  .line.on { background:var(--coral); border-color:var(--coral); color:#fff; box-shadow:0 6px 16px -6px rgba(245,97,56,.6); }
  .direction { margin-top:10px; font:italic 600 13px Nunito; color:var(--muted); }
  .direction b { color:var(--coral); font-style:normal; }

  .section { font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:1.2px; color:var(--muted); display:flex; align-items:center; gap:8px; }
  .section::after { content:""; flex:1; height:2px; background:var(--line); border-radius:2px; }
  .block { padding:22px 28px 0; }

  /* cards */
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(290px, 1fr)); gap:18px; margin-top:14px; }
  .card { background:var(--card); border:2px solid transparent; border-radius:24px; padding:18px; display:flex; flex-direction:column; gap:14px; box-shadow:var(--shadow); transition:transform .18s, box-shadow .18s, border-color .18s; position:relative; }
  .card:hover { transform:translateY(-3px); box-shadow:0 2px 0 rgba(180,110,70,.08), 0 18px 36px -14px rgba(180,110,70,.45); }
  .card.star { border-color:var(--peach); }
  .card.picked { border-color:var(--mint); background:linear-gradient(180deg, var(--mintbg), #fff 55%); }
  .badge { position:absolute; top:-10px; right:16px; background:var(--mint); color:#fff; font:600 12px Fredoka; padding:3px 10px; border-radius:999px; box-shadow:0 4px 10px -4px rgba(63,185,138,.7); }
  .rank { position:absolute; top:14px; right:16px; font:700 13px Fredoka; color:var(--peach2); }
  .card .top { display:flex; align-items:center; gap:14px; }
  .avatar { width:64px; height:64px; border-radius:50%; flex:none; position:relative; background:linear-gradient(135deg, var(--peach), var(--blush)); padding:3px; }
  .avatar img { width:100%; height:100%; border-radius:50%; object-fit:cover; display:block; background:var(--bg2); border:2px solid #fff; }
  .avatar .prev { position:absolute; right:-4px; bottom:-4px; width:28px; height:28px; border-radius:50%; border:2px solid #fff; background:var(--ink); color:#fff; font-size:10px; display:grid; place-items:center; cursor:pointer; padding:0; transition:transform .15s; }
  .avatar .prev:hover { transform:scale(1.12); }
  .avatar .prev.playing { background:var(--mint); }
  .card .title { font-weight:600; font-size:18px; line-height:1.15; padding-right:28px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card .meta { font-size:12.5px; font-weight:700; color:var(--muted); margin-top:3px; }
  .vid { font:11.5px ui-monospace, Menlo, monospace; color:var(--id); background:var(--bg); border:1px dashed var(--peach); border-radius:10px; padding:6px 10px; user-select:all; word-break:break-all; cursor:copy; text-align:center; }

  .takes { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  button { cursor:pointer; font-weight:600; border:none; transition:transform .12s, background .15s, box-shadow .15s; }
  button:active { transform:scale(.97); }
  .take { border-radius:16px; padding:14px 8px; font-size:16px; white-space:nowrap; display:flex; align-items:center; justify-content:center; gap:8px; }
  .take.std { background:#f6efe9; color:#7d6559; }
  .take.std:hover { background:#efe3d9; }
  .take.drama { background:linear-gradient(135deg, #ffd9c2, #ffc3cf); color:#8a2f1a; }
  .take.drama:hover { background:linear-gradient(135deg, #ffcfb3, #ffb6c4); }
  .take .ico { width:26px; height:26px; border-radius:50%; background:rgba(255,255,255,.75); display:grid; place-items:center; font-size:10px; }
  .take.playing { box-shadow:0 0 0 3px var(--mint) inset; }
  .take.playing .ico { background:var(--mint); color:#fff; }
  .take.busy .ico { animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg) } }
  .take.err { box-shadow:0 0 0 2px #e0665a inset; }
  .foot { display:flex; gap:10px; }
  .starbtn { width:50px; flex:none; border-radius:14px; background:#fff; border:2px solid var(--line); font-size:20px; color:var(--peach2); }
  .starbtn:hover { border-color:var(--peach2); }
  .choose { flex:1; border-radius:14px; padding:13px; font-size:16px; color:#fff; background:var(--coral); box-shadow:0 8px 18px -8px rgba(245,97,56,.75); }
  .choose:hover { background:var(--coral2); }
  .card.picked .choose { background:var(--mint); box-shadow:0 8px 18px -8px rgba(63,185,138,.75); }

  .pager { display:flex; justify-content:center; gap:12px; padding:26px 28px 10px; }
  .pager button { background:#fff; color:var(--ink); border:2px solid var(--line); border-radius:999px; padding:10px 22px; font-size:15px; }
  .pager button:hover:not(:disabled) { border-color:var(--peach2); }
  .pager button:disabled { opacity:.4; cursor:default; }
  footer { padding:10px 28px 40px; }
  footer summary { color:var(--muted); font:700 12px Nunito; cursor:pointer; }
  footer pre { background:#2b1f1a; color:#ffd9c2; padding:14px; border-radius:14px; font-size:12px; white-space:pre-wrap; }
  .toast { position:fixed; bottom:24px; left:50%; transform:translate(-50%, 20px); background:var(--ink); color:#fff; padding:12px 18px; border-radius:999px; font:600 15px Fredoka; opacity:0; transition:all .25s; pointer-events:none; box-shadow:0 12px 30px -10px rgba(0,0,0,.4); }
  .toast.show { opacity:1; transform:translate(-50%, 0); }
  @media (max-width:640px) { header, .lines-wrap, .block, .pager, footer { padding-left:16px; padding-right:16px; } .chosen { margin-left:0; width:100%; } }
</style>
</head>
<body>
<header>
  <div class="brand">
    <!-- Pom-pom: fluffy peach puffball bear -->
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="24" cy="24" r="13" fill="#ffb48a"/><circle cx="24" cy="24" r="6.5" fill="#ff9eaa"/>
      <circle cx="76" cy="24" r="13" fill="#ffb48a"/><circle cx="76" cy="24" r="6.5" fill="#ff9eaa"/>
      <g fill="#ffc8a8">
        <circle cx="50" cy="56" r="38"/>
        <circle cx="50" cy="17" r="6"/><circle cx="72" cy="24" r="6"/><circle cx="85" cy="42" r="6"/><circle cx="88" cy="62" r="6"/><circle cx="80" cy="80" r="6"/><circle cx="63" cy="92" r="6"/>
        <circle cx="37" cy="92" r="6"/><circle cx="20" cy="80" r="6"/><circle cx="12" cy="62" r="6"/><circle cx="15" cy="42" r="6"/><circle cx="28" cy="24" r="6"/>
      </g>
      <ellipse cx="37" cy="52" rx="6" ry="7.5" fill="#3d2a22"/><ellipse cx="63" cy="52" rx="6" ry="7.5" fill="#3d2a22"/>
      <circle cx="39" cy="49" r="2.2" fill="#fff"/><circle cx="65" cy="49" r="2.2" fill="#fff"/>
      <ellipse cx="28" cy="64" rx="6" ry="3.5" fill="#ff9eaa" opacity=".8"/><ellipse cx="72" cy="64" rx="6" ry="3.5" fill="#ff9eaa" opacity=".8"/>
      <path d="M44 63 Q50 69 56 63" stroke="#3d2a22" stroke-width="3" fill="none" stroke-linecap="round"/>
    </svg>
    <div><h1>Pip's voice audition</h1><small>Fish Audio · Flat vs Drama 3</small></div>
  </div>
  <label class="search"><input type="text" id="q" placeholder="Search voices…"></label>
  <div class="chosen" id="chosen"></div>
</header>

<div class="lines-wrap">
  <div class="section">Pick a line</div>
  <div class="lines" id="lines"></div>
  <div class="direction" id="direction"></div>
</div>

<div class="block" id="shortlistBlock" hidden>
  <div class="section">⭐ Shortlist</div>
  <div class="grid" id="shortlist"></div>
</div>
<div class="block">
  <div class="section" id="resultsHead">🔥 Most popular</div>
  <div class="grid" id="results"></div>
</div>
<div class="pager"><button id="prev">‹ Back</button><button id="next">More voices ›</button></div>
<footer><details><summary>Show the API request</summary><pre id="lastreq">Play a take to see the request.</pre></details></footer>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const PAGE_SIZE = 6;
let CFG = {}, page = 1, lineIdx = 0;
const starred = JSON.parse(localStorage.getItem('pip_shortlist') || '{}');
const LINES = [
  ['Oh. You\'re back. I missed you.', 'gasps, then bursts into happy tears, trying to stay composed'],
  ['Hey! That tickles! Do it again.', 'squealing with delight, giggling, out of breath'],
  ['Whoa whoa whoa, put me down!', 'dizzy, panicking, words wobbling, then a tiny hiccup'],
  ['Three new subscribers. We are basically famous.', 'smug, whispering a secret, then bursting with pride'],
  ['You look tired. Want a hug?', 'soft, worried, very gentle, leaning in'],
  ['Is it bedtime yet? Five more minutes.', 'yawning, sleepy, drifting off mid sentence'],
  ['I love you. Do not tell anyone.', 'shy, blushing, mumbling, then a sudden squeak'],
];
const player = new Audio();
let playingBtn = null;
player.addEventListener('ended', () => { playingBtn?.classList.remove('playing'); playingBtn = null; });
const clips = new Map();

function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'), 2200); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){ return n >= 1e6 ? (n/1e6).toFixed(1).replace(/\.0$/,'') + 'M' : n >= 1e3 ? Math.round(n/1e3) + 'k' : String(n); }
function take(kind){ const [l,d] = LINES[lineIdx]; return kind==='drama' ? {model:CFG.drama_model, text:`[${d}] ${l}`} : {model:CFG.standard_model, text:l}; }

function playUrl(url, btn){
  if (playingBtn === btn && !player.paused) { player.pause(); btn.classList.remove('playing'); playingBtn = null; return; }
  playingBtn?.classList.remove('playing'); playingBtn = btn; btn.classList.add('playing');
  player.src = url; player.play().catch(()=>{});
}

async function render(voice, kind, btn){
  const t = take(kind); const key = `${t.model}|${voice.id}|${t.text}`;
  if (clips.has(key)) return playUrl(clips.get(key), btn);
  btn.classList.add('busy'); btn.classList.remove('err');
  try {
    const r = await fetch('/api/tts', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({voice_id:voice.id, model:t.model, text:t.text, sample_rate:CFG.sample_rate})});
    if (!r.ok) { const j = await r.json().catch(()=>({})); throw new Error(j.error || r.statusText); }
    const req = r.headers.get('X-Request'); if (req) $('#lastreq').textContent = JSON.parse(req);
    const url = URL.createObjectURL(await r.blob()); clips.set(key, url); playUrl(url, btn);
  } catch (e) { btn.classList.add('err'); toast('Oops: ' + e.message); }
  finally { btn.classList.remove('busy'); }
}

function card(v, rank){
  const picked = v.id === CFG.voice_id;
  const el = document.createElement('div');
  el.className = 'card' + (starred[v.id] ? ' star' : '') + (picked ? ' picked' : '');
  el.dataset.id = v.id;
  el.innerHTML = `
    ${picked ? '<span class="badge">Pip\'s voice</span>' : rank ? `<span class="rank">#${rank}</span>` : ''}
    <div class="top">
      <div class="avatar">
        <img src="${v.cover ? esc(v.cover) : ''}" alt="" onerror="this.style.opacity=0">
        ${v.preview ? '<button class="prev" title="Library sample">▶</button>' : ''}
      </div>
      <div style="min-width:0">
        <div class="title">${esc(v.title)}</div>
        <div class="meta">${fmt(v.task_count)} uses · ${fmt(v.like_count)} ♥</div>
      </div>
    </div>
    <div class="vid" title="Click to copy">${esc(v.id)}</div>
    <div class="takes">
      <button class="take std"><span class="ico">▶</span>Flat</button>
      <button class="take drama"><span class="ico">▶</span>Drama 3</button>
    </div>
    <div class="foot">
      <button class="starbtn" title="Shortlist">${starred[v.id] ? '★' : '☆'}</button>
      <button class="choose">${picked ? '✓ Chosen' : 'Choose for Pip'}</button>
    </div>`;
  el.querySelector('.prev')?.addEventListener('click', e => playUrl(v.preview, e.currentTarget));
  el.querySelector('.vid').onclick = () => navigator.clipboard?.writeText(v.id).then(() => toast('Voice ID copied'));
  el.querySelector('.std').onclick = e => render(v, 'std', e.currentTarget);
  el.querySelector('.drama').onclick = e => render(v, 'drama', e.currentTarget);
  el.querySelector('.starbtn').onclick = () => {
    if (starred[v.id]) delete starred[v.id]; else starred[v.id] = v;
    localStorage.setItem('pip_shortlist', JSON.stringify(starred)); drawShortlist();
    document.querySelectorAll(`.card[data-id="${v.id}"]`).forEach(c => { c.classList.toggle('star', !!starred[v.id]); c.querySelector('.starbtn').textContent = starred[v.id] ? '★' : '☆'; });
  };
  el.querySelector('.choose').onclick = async () => {
    const r = await fetch('/api/pick', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({voice_id:v.id, title:v.title})});
    if (!r.ok) return toast('Could not write .env');
    CFG.voice_id = v.id; showChosen(v.title); toast(`🐻 ${v.title} is Pip's voice now`); drawShortlist(); search(page, false);
  };
  return el;
}

function showChosen(title){
  const c = $('#chosen'); c.classList.toggle('set', !!CFG.voice_id);
  c.innerHTML = CFG.voice_id
    ? `<div><div class="lbl">Pip's voice</div><div class="name">${esc(title || 'Chosen')}</div><code>${esc(CFG.voice_id)}</code></div>`
    : `<div><div class="lbl">Pip's voice</div><div class="name">Not chosen yet</div></div>`;
}
function drawShortlist(){ const s=$('#shortlist'); s.innerHTML=''; const vs=Object.values(starred); $('#shortlistBlock').hidden = !vs.length; for (const v of vs) s.appendChild(card(v)); }
function drawLines(){
  $('#lines').innerHTML = '';
  LINES.forEach(([l], i) => { const b=document.createElement('button'); b.className='line' + (i===lineIdx ? ' on' : ''); b.textContent=`“${l}”`; b.onclick=()=>{ lineIdx=i; drawLines(); }; $('#lines').appendChild(b); });
  $('#direction').innerHTML = `Drama 3 plays it as <b>[${esc(LINES[lineIdx][1])}]</b>`;
}

async function search(p, scroll = true){
  page = Math.max(1, p||1); const q = $('#q').value.trim();
  $('#resultsHead').textContent = q ? `🔎 “${q}”, most popular first` : '🔥 Most popular';
  const r = await fetch(`/api/voices?q=${encodeURIComponent(q)}&sort=task_count&page=${page}&n=${PAGE_SIZE}`);
  if (!r.ok) return toast('Fish returned ' + r.status);
  const d = await r.json(); $('#next').disabled = !d.has_more; $('#prev').disabled = page <= 1;
  const res = $('#results'); res.innerHTML = '';
  d.items.forEach((v, i) => res.appendChild(card(v, q ? 0 : (page-1)*PAGE_SIZE + i + 1)));
  if (scroll && p > 1) $('#resultsHead').scrollIntoView({behavior:'smooth', block:'start'});
}

(async function init(){
  CFG = await (await fetch('/api/config')).json();
  drawLines();
  let chosenTitle = '';
  if (CFG.voice_id) { const r = await fetch('/api/voice/'+CFG.voice_id); if (r.ok) chosenTitle = (await r.json()).title; }
  showChosen(chosenTitle);
  let t; $('#q').addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => search(1), 350); });
  $('#prev').onclick = () => search(page-1); $('#next').onclick = () => search(page+1);
  drawShortlist(); search(1);
})();
</script>
</body>
</html>
